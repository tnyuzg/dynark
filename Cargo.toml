[package]
name = "dynark"
version = "0.1.0"
description = "Reference implementation of Dynark: Making Groth16 Dynamic"
documentation = "https://eprint.iacr.org/2025/1897"
readme = "README.md"
keywords = ["zero-knowledge", "cryptography", "zkSNARK", "Groth16", "dynamic"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
edition = "2021"

[dependencies]
# Keys, proofs and the verifier come from unmodified upstream Groth16.
ark-groth16 = { version = "0.5.0", default-features = false, features = ["std"] }
ark-ec = "0.5.0"
ark-ff = "0.5.0"
ark-poly = "0.5.0"
ark-relations = "0.5.0"
ark-serialize = { version = "0.5.0", features = ["derive"] }
ark-std = "0.5.0"
rayon = "1"
# Index sampling for the synthetic update workloads.
rand = "0.9.2"

[dev-dependencies]
ark-bls12-377 = { version = "0.5.0", features = ["curve"] }
ark-bls12-381 = { version = "0.5.0", features = ["curve"] }
ark-bn254 = { version = "0.5.0", features = ["curve"] }
ark-bw6-761 = "0.5.0"
ark-crypto-primitives = { version = "0.5.0", features = ["crh", "r1cs"] }
ark-r1cs-std = "0.5.0"
sha2 = "0.10.7"

[features]
default = ["parallel"]
parallel = [
    "ark-ec/parallel",
    "ark-ff/parallel",
    "ark-groth16/parallel",
    "ark-poly/parallel",
    "ark-std/parallel",
]
print-trace = ["ark-std/print-trace"]

[profile.release]
opt-level = 3
lto = "thin"
incremental = true
panic = "abort"

[profile.dev]
opt-level = 0
panic = "abort"

[profile.test]
opt-level = 3
lto = "thin"
incremental = true
debug-assertions = true
debug = true

[profile.bench]
opt-level = 3
lto = "thin"
incremental = true

[[bench]]
name = "setup"
harness = false

[[bench]]
name = "preprocessing"
harness = false

[[bench]]
name = "cross_term"
harness = false

[[bench]]
name = "provers"
harness = false

[[bench]]
name = "updates"
harness = false
